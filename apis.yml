aid: levicept
name: Levicept
description: 'Levicept Ltd is a UK-based clinical-stage biotechnology company headquartered
  at Innovation House, Discovery Park in Sandwich, Kent, developing LEVI-04, a fully
  human chimeric fusion protein combining the Fc fragment of human immunoglobulin G1
  with the p75 neurotrophin receptor (p75NTR) for the treatment of chronic pain. LEVI-04
  is a first-in-class neurotrophin-3 (NT-3) inhibitor designed to restore neurotrophin
  homeostasis and deliver analgesia without the use-limiting side effects — notably
  rapidly progressive osteoarthritis — seen with anti-NGF antibodies. The company completed
  a 510+ participant Phase II study in osteoarthritis of the knee (NCT05618782) that
  met all primary and secondary endpoints, published the results in The Lancet in March
  2026, and had its IND accepted by the US FDA in January 2026. Levicept is backed by
  Medicxi, Pfizer Ventures, Gilde Healthcare, Advent Life Sciences and Innovate UK.
  Levicept is a therapeutics developer, not a software vendor: it operates a WordPress
  corporate website and publishes no API, SDK, developer portal or machine-readable
  contract of any kind.'
